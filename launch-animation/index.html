<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo · 启动动画</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080d17;color:#eef4ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px}main{display:flex;align-items:center;gap:88px}.intro{max-width:330px}.eyebrow{font-size:11px;letter-spacing:.24em;color:#7b9ac0}h1{font-size:36px;font-weight:550;letter-spacing:-.04em;margin:18px 0}p{color:#8c9bb0;line-height:1.9;font-size:14px}.details{border-top:1px solid #ffffff12;margin-top:32px;padding-top:20px;display:flex;gap:32px}.details span{display:block;font-size:11px;color:#71829c;margin-top:8px}.details b{font-size:14px;font-weight:500}button{background:#ecf4ff;border:0;border-radius:99px;color:#10213b;padding:13px 26px;font:inherit;font-size:13px;cursor:pointer;margin-top:30px}button:hover{background:#c9e0ff}button:focus-visible,input:focus-visible{outline:2px solid #55c8ff;outline-offset:5px}label{font-size:12px;color:#95a4ba;margin-left:16px;cursor:pointer}input{accent-color:#67b8ff;vertical-align:middle}.device{width:340px;height:700px;border:1px solid #344052;border-radius:48px;padding:8px;background:#101724;box-shadow:0 32px 90px #0007}.screen{height:100%;position:relative;border-radius:40px;overflow:hidden;background:#031a3d;display:grid;place-items:center}.logo{display:block;width:62%;height:auto;opacity:0;transform:scale(.86);will-change:transform,opacity}.playing .logo{animation:entrance 2200ms both}.island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:92px;height:25px;border-radius:30px;background:#020916;z-index:2}.home{position:absolute;bottom:10px;width:110px;height:4px;border-radius:10px;background:#d8e7ff77}.caption{text-align:center;color:#687b97;font-size:11px;margin-top:18px;letter-spacing:.1em}.track{height:2px;background:#ffffff0c;margin-top:26px;border-radius:3px;overflow:hidden}.fill{height:100%;background:#62baff;width:0}.running .fill{animation:progress 2200ms linear both}@keyframes entrance{0%{opacity:0;transform:scale(.86)}16%{opacity:.25}52%{opacity:1;transform:scale(1.025)}76%,100%{opacity:1;transform:scale(1)}}@keyframes progress{to{width:100%}}@media(prefers-reduced-motion:reduce){.playing .logo{animation:none;opacity:1;transform:none}.running .fill{animation:none;width:100%}}@media(max-width:760px){body{padding:24px}main{flex-direction:column-reverse;gap:28px}.device{width:280px;height:570px;border-radius:40px}.screen{border-radius:32px}.intro{max-width:340px;width:100%}h1{font-size:28px;margin:12px 0}.details{margin-top:18px}button{margin-top:20px}}
</style></head>
<body><main><section class="intro"><div class="eyebrow">LAUNCH ANIMATION / 01</div><h1>安心，从启动开始。</h1><p>蓝色盾牌缓缓浮现，轻微放大后自然回落，停留在完整 Logo 上。</p><div class="details"><div><b>2.2 秒</b><span>单次启动时长</span></div><div><b>柔和缓出</b><span>渐显 · 放大 · 停留</span></div><div><b>原图保真</b><span>保留完整比例与色彩</span></div></div><button id="replay" type="button">重新播放</button><label><input id="loop" type="checkbox"> 循环预览</label><div class="track"><div class="fill"></div></div></section><section aria-label="手机启动动画预览"><div class="device"><div class="screen"><div class="island" aria-hidden="true"></div><img class="logo" src="logo-original.png" alt="蓝色盾牌与白色对勾 Logo"><div class="home" aria-hidden="true"></div></div></div><div class="caption" id="status" aria-live="polite">准备播放</div></section></main>
<script>
const screen=document.querySelector('.screen'),intro=document.querySelector('.intro'),status=document.querySelector('#status'),loop=document.querySelector('#loop'),logo=document.querySelector('.logo');let timer;function play(){clearTimeout(timer);screen.classList.remove('playing');intro.classList.remove('running');void screen.offsetWidth;screen.classList.add('playing');intro.classList.add('running');status.textContent='正在播放 · 2.2 秒';timer=setTimeout(()=>{status.textContent='播放完成 · Logo 停留';if(loop.checked)timer=setTimeout(play,1000)},2200)}document.querySelector('#replay').addEventListener('click',play);loop.addEventListener('change',()=>{if(loop.checked)play();else clearTimeout(timer)});if(logo.complete&&logo.naturalWidth)play();else logo.addEventListener('load',play,{once:true});
</script></body></html>
