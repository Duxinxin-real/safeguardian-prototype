<script>
const calendarDialog = document.createElement('dialog');
calendarDialog.className = 'calendar-dialog';
calendarDialog.setAttribute('aria-labelledby', 'calendar-title');
calendarDialog.innerHTML = `<section class="calendar-panel"><div class="calendar-heading"><h2 id="calendar-title">Blocking Calendar</h2><button class="calendar-close" aria-label="Close calendar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="month-nav"><button class="month-prev" aria-label="Previous month"><svg aria-hidden="true" style="transform:rotate(180deg)"><use href="#arrow"/></svg></button><strong class="month-label"></strong><button class="month-next" aria-label="Next month"><svg aria-hidden="true"><use href="#arrow"/></svg></button></div><div class="weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar-grid" aria-label="Select date"></div><div class="calendar-summary" aria-live="polite"><h3 class="selected-date"></h3><div class="day-stats"><div><strong>—</strong>Ads</div><div><strong>—</strong>Pop-ups</div><div><strong>—</strong>Trackers</div></div><p class="empty-day">No blocking records</p></div></section>`;
document.querySelector('.phone').append(calendarDialog);
const todayParts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const datePart = type => Number(todayParts.find(part => part.type === type).value);
const today = new Date(datePart('year'),datePart('month')-1,datePart('day'));
let selectedDate = new Date(today);
let calendarMonth = new Date(today.getFullYear(),today.getMonth(),1);
function renderCalendar() {
  calendarDialog.querySelector('.month-label').textContent = calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  calendarDialog.querySelector('.selected-date').textContent = selectedDate.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const grid = calendarDialog.querySelector('.calendar-grid');
  grid.replaceChildren();
  for(let offset=0;offset<calendarMonth.getDay();offset++) grid.append(document.createElement('span'));
  const days = new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();
  for(let day=1;day<=days;day++) {
    const date = new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),day);
    const button = document.createElement('button');
    button.textContent = day;
    button.disabled = date > today;
    const selected = date.getTime() === selectedDate.getTime();
    button.classList.toggle('selected',selected);
    button.setAttribute('aria-pressed',String(selected));
    button.setAttribute('aria-label',date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}));
    button.addEventListener('click',()=>{selectedDate=date;renderCalendar();grid.querySelector('.selected').focus();});
    grid.append(button);
  }
  calendarDialog.querySelector('.month-next').disabled = calendarMonth.getFullYear() === today.getFullYear() && calendarMonth.getMonth() === today.getMonth();
  document.dispatchEvent(new Event('blocking-calendar-rendered'));
}
let calendarBackground = [];
document.querySelector('.calendar-open').addEventListener('click',()=>{
  renderCalendar();
  calendarBackground = [...calendarDialog.parentElement.children].filter(element=>element!==calendarDialog).map(element=>({element,inert:element.inert}));
  calendarBackground.forEach(({element})=>{element.inert=true;});
  calendarDialog.setAttribute('aria-modal','true');
  calendarDialog.show();
  calendarDialog.querySelector('.calendar-close').focus();
});
calendarDialog.querySelector('.calendar-close').addEventListener('click',()=>calendarDialog.close());
calendarDialog.addEventListener('click',event=>{if(event.target===calendarDialog)calendarDialog.close();});
calendarDialog.addEventListener('close',()=>{
  calendarBackground.forEach(({element,inert})=>{element.inert=inert;});
  document.querySelector('.calendar-open').focus();
});
calendarDialog.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();calendarDialog.close();}
  if(event.key!=='Tab')return;
  const buttons=[...calendarDialog.querySelectorAll('button:not(:disabled)')];
  const first=buttons[0],last=buttons[buttons.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
});
calendarDialog.querySelector('.month-prev').addEventListener('click',()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar();});
calendarDialog.querySelector('.month-next').addEventListener('click',()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar();});
const notice = document.querySelector('.notice');
const phone = document.querySelector('.phone');
const protectionSwitch = document.querySelector('.toggle');
const inactiveShield = document.querySelector('.shield img');
inactiveShield.classList.add('inactive-shield');
const activeShield = inactiveShield.cloneNode();
activeShield.className = 'active-shield';
activeShield.src = 'assets/home-active-reference.png';
activeShield.alt = 'Active protection shield';
activeShield.setAttribute('aria-hidden', 'true');
document.querySelector('.shield').append(activeShield);
protectionSwitch.removeAttribute('data-message');
protectionSwitch.addEventListener('click', () => {
  const enabled = protectionSwitch.getAttribute('aria-checked') !== 'true';
  phone.classList.toggle('is-active', enabled);
  protectionSwitch.setAttribute('aria-checked', String(enabled));
  protectionSwitch.setAttribute('aria-label', enabled ? 'Disable Safari protection' : 'Enable Safari protection');
  document.querySelector('.state').lastChild.textContent = enabled ? 'Active' : 'Inactive';
  document.querySelectorAll('.row-status').forEach(status => { status.textContent = enabled ? 'On' : 'Off'; });
  document.querySelectorAll('.row-status').forEach(status => {
    const row = status.closest('.row');
    row.dataset.message = `${row.querySelector('.label').textContent} is currently ${enabled ? 'on' : 'off'}.`;
  });
  activeShield.setAttribute('aria-hidden', String(!enabled));
  inactiveShield.setAttribute('aria-hidden', String(enabled));
  notice.hidden = true;
});

const testPage = document.createElement('section');
testPage.className = 'test-page';
testPage.hidden = true;
testPage.setAttribute('aria-label','Network Speed Test');
testPage.innerHTML = `<div class="test-top"><h1>WiFi Test</h1></div><section class="test-card"><div class="speed-stage"><svg class="speed-dial" viewBox="0 0 340 250"><defs><linearGradient id="dial-color"><stop stop-color="#064aff"/><stop offset="1" stop-color="#b8c2ff"/></linearGradient></defs><path class="dial-track" d="M53 202 A125 125 0 1 1 287 202"/><path class="dial-progress" pathLength="100" d="M53 202 A125 125 0 1 1 287 202"/><g class="dial-ticks"></g><g class="dial-needle"><path d="M166 145 L170 30 L174 145 Z" fill="#031b40"/><circle cx="170" cy="145" r="7" fill="#031b40" stroke="white"/></g></svg><div class="speed-number"><div class="speed-value">186.4</div><div class="speed-unit">Mbps</div><div class="speed-phase" role="status">Test complete</div></div></div><div class="speed-metrics"><div><span class="badge blue"><span class="asset-icon" style="--icon:url(icons/arrow-down.svg)" aria-hidden="true"></span></span>Download<p><strong class="download-result">186.4</strong><small>Mbps</small></p></div><div><span class="badge green"><span class="asset-icon" style="--icon:url(icons/upload.svg)" aria-hidden="true"></span></span>Upload<p><strong class="upload-result">42.8</strong><small>Mbps</small></p></div><div><span class="badge purple"><span class="asset-icon" style="--icon:url(icons/arrow-left-right.svg)" aria-hidden="true"></span></span>Ping<p><strong class="ping-result">18</strong><small>ms</small></p></div></div><button class="start-test">Test Again</button></section><section class="wifi-card"><h2>Wi-Fi Check</h2><div class="wifi-row"><span class="badge green"><svg><use href="#lock"/></svg></span><span>WiFi Authentication</span><strong class="wifi-result">Safe</strong></div><div class="wifi-row"><span class="badge blue"><span class="asset-icon" style="--icon:url(icons/globe-lock.svg)" aria-hidden="true"></span></span><span>DNS Security</span><strong class="wifi-result">Safe</strong></div></section>`;
phone.insertBefore(testPage,document.querySelector('.tabs'));
for(let index=0;index<=30;index++) {
  const angle=(-90+index*6)*Math.PI/180;
  const major=index%5===0;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',170+Math.sin(angle)*102);
  line.setAttribute('y1',145-Math.cos(angle)*102);
  line.setAttribute('x2',170+Math.sin(angle)*(major?92:96));
  line.setAttribute('y2',145-Math.cos(angle)*(major?92:96));
  line.setAttribute('stroke',major?'#4d6286':'#c0ccde');
  line.setAttribute('stroke-width',major?'1.5':'1');
  testPage.querySelector('.dial-ticks').append(line);
}
function updateGauge(value) {
  const fraction=Math.min(value/250,1);
  testPage.querySelector('.dial-progress').style.strokeDashoffset=100-fraction*100;
  testPage.querySelector('.dial-needle').style.transform='rotate('+(-115+fraction*230)+'deg)';
}
updateGauge(186.4);
const navigationTabs = [...document.querySelectorAll('.tab')];
const protectTab = navigationTabs[0];
const testTab = navigationTabs[1];
const liveTestTab = testTab.cloneNode(true);
liveTestTab.removeAttribute('data-message');
testTab.replaceWith(liveTestTab);
function showTest(visible) {
  vaultPage.hidden = true;
  phone.classList.remove('vault-visible');
  liveVaultTab.classList.remove('active');
  liveVaultTab.removeAttribute('aria-current');
  if(!visible) stopSpeedTest();
  testPage.hidden = !visible;
  phone.classList.toggle('test-visible',visible);
  protectTab.classList.toggle('active',!visible);
  liveTestTab.classList.toggle('active',visible);
  protectTab.removeAttribute('aria-current');
  liveTestTab.removeAttribute('aria-current');
  (visible ? liveTestTab : protectTab).setAttribute('aria-current','page');
  document.querySelector('.scroll').inert = visible;
  notice.hidden = true;
}
protectTab.addEventListener('click',()=>showTest(false));
liveTestTab.addEventListener('click',()=>showTest(true));
let testTimer;
let completedTests = 1;
const startTest = testPage.querySelector('.start-test');
function stopSpeedTest() {
  if(!testTimer) return;
  clearInterval(testTimer);
  testTimer = undefined;
  startTest.disabled = false;
  startTest.textContent = completedTests ? 'Test Again' : 'Start Test';
  testPage.querySelector('.speed-phase').textContent = 'Test stopped';
  testPage.querySelectorAll('.wifi-result').forEach(result=>{result.textContent='Not tested';result.classList.add('pending');});
}
startTest.addEventListener('click',()=>{
  startTest.disabled=true;
  startTest.textContent='Testing…';
  testPage.querySelectorAll('.wifi-result').forEach(result=>{result.textContent='Testing';result.classList.add('pending');});
  testPage.querySelector('.download-result').textContent='—';
  testPage.querySelector('.upload-result').textContent='—';
  testPage.querySelector('.ping-result').textContent='—';
  const start = performance.now();
  const download = completedTests % 2 === 0 ? 186.4 : 181.7;
  const upload = completedTests % 2 === 0 ? 42.8 : 43.2;
  testTimer=setInterval(()=>{
    const elapsed=(performance.now()-start)/1000;
    const uploadPhase=elapsed>=4;
    const progress=Math.min((uploadPhase ? elapsed-4 : elapsed)/4,1);
    const value=(uploadPhase ? upload : download)*Math.min(progress*2,1)*(1+Math.sin(elapsed*7)*.04);
    testPage.querySelector('.speed-phase').textContent=uploadPhase ? 'Testing upload' : 'Testing download';
    testPage.querySelector('.speed-value').textContent=value.toFixed(1);
    updateGauge(value);
    testPage.querySelector('.ping-result').textContent='18';
    if(uploadPhase)testPage.querySelector('.download-result').textContent=download.toFixed(1);
    if(elapsed>=8){
      clearInterval(testTimer);testTimer=undefined;
      testPage.querySelector('.upload-result').textContent=upload.toFixed(1);
      testPage.querySelector('.speed-value').textContent=download.toFixed(1);
      updateGauge(download);
      testPage.querySelector('.speed-phase').textContent='Test complete';
      testPage.querySelectorAll('.wifi-result').forEach(result=>{result.textContent='Safe';result.classList.remove('pending');});
      completedTests++;
      startTest.disabled=false;startTest.textContent='Test Again';
    }
  },100);
});
